name: ATLAS recovery gate

on:
  push:
  pull_request:

jobs:
  verify-portable-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: atlas/pyproject.toml

      - name: Install laptop-safe test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Reject obvious committed secrets
        run: python scripts/check_no_secrets.py

      - name: Verify recovery bundle
        run: python scripts/verify_recovery_bundle.py

      - name: Verify repository layout and navigation
        run: python scripts/verify_repository_layout.py

      - name: Lint maintained runtime and tests
        run: ruff check src tests scripts

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run laptop-safe test suite
        run: python scripts/run_deployment_pytest.py
